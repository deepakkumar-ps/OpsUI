version: "3.8"

# OpsUI 2.0 on the swarm manager (10.104.10.88), port 3000
services:
  opsui:
    image: deepakkumarps08122/opsui:1.0
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host                       # served only on this VM
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker:/opt/docker          # workspace + saved commands (opsui-commands.json)
      - /var/log/bridge:/logs:ro         # remove this line if Bridge has no log files on the host
      - /:/host                          # Files tab: browse/edit the whole VM filesystem
      # Optional: passwordless "VM (SSH)" terminals - mount a key pair whose public key
      # is in ~/.ssh/authorized_keys of the VM user:
      # - /home/ocsautotest/.ssh/opsui_key:/root/.ssh/id_ed25519:ro
    environment:
      WORKSPACE: /opt/docker
      LOG_ROOT: /logs
      FILES_ROOT: /host                  # Files tab root (= the VM's /)
      FILES_HOME: opt/docker             # folder the Files tab opens in
      OPS_USER: admin
      OPS_PASS_FILE: /run/secrets/opsui_password
      VM_SSH: ocsautotest@10.104.10.88   # default target for "VM (SSH)" terminals
      MAX_STREAMS: "3"
      MAX_TERMS: "4"
      TZ: Europe/London
    secrets:
      - opsui_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"                   # hard ceiling; idle use is ~0%
          memory: 192M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

secrets:
  opsui_password:
    external: true
